    <path d="M1107 762 1159 737V765L1107 791Z"/>
    <path d="M1107 815 1159 788 1160 1016 1107 1047Z"/>
    <path d="M1107 1073 1160 1043V1085L1107 1116Z"/>
  </g>
  <g class="book book-right" fill="#500c25">
    <path d="M1218 612 1273 582V612L1218 643Z"/>
