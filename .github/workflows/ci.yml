name: PWA checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: pwa-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [gallery, offline, pdf, library, discovery, ux, production, auth-config]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - if: matrix.suite == 'production'
        run: npm run build
      - if: matrix.suite == 'gallery'
        run: npm test
      - if: matrix.suite != 'gallery'
        run: npm run test:${{ matrix.suite }}
