name: PWA checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: pwa-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:offline
      - run: npm run test:pdf
      - run: npm run test:library
      - run: npm run test:discovery
      - run: npm run test:ux
      - run: npm run test:production
      - run: npm run test:auth-config
